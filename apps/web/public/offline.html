<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Tracklane</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.7;
        line-height: 1.5;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 0;
        background: #18181b;
        color: #fafafa;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Tracklane needs a connection to load your work. We'll pick up where you left off.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
