name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tracklane
          POSTGRES_PASSWORD: tracklane
          POSTGRES_DB: tracklane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracklane" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://tracklane:tracklane@localhost:5432/tracklane
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s#^BETTER_AUTH_SECRET=.*#BETTER_AUTH_SECRET=$(openssl rand -base64 32)#" .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @tracklane/db migrate:deploy
      - name: Check migrations match schema.prisma
        # Exit code 2 means the schema has changes no migration covers.
        run: pnpm --filter @tracklane/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @tracklane/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @tracklane/web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image and production stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure deploy/.env for plain HTTP on localhost
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s#^DOMAIN=.*#DOMAIN=:80#" deploy/.env
          sed -i "s#^NEXT_PUBLIC_APP_URL=.*#NEXT_PUBLIC_APP_URL=http://localhost#" deploy/.env
          sed -i "s#^BETTER_AUTH_SECRET=.*#BETTER_AUTH_SECRET=$(openssl rand -hex 32)#" deploy/.env
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=$(openssl rand -hex 16)#" deploy/.env
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/health; then echo; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Smoke test
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/sign-in)" = 200
          curl -fsS -X POST http://localhost/api/auth/sign-up/email \
            -H 'content-type: application/json' -H 'origin: http://localhost' \
            -d '{"name":"CI","email":"ci@example.com","password":"ci-password-123"}' | grep -q '"user"'
          curl -fsS "http://localhost/api/realtime/?EIO=4&transport=polling" | grep -q '"sid"'
          docker compose -f deploy/docker-compose.yml ps
          test "$(docker compose -f deploy/docker-compose.yml ps -a --format '{{.Service}} {{.ExitCode}}' | grep '^migrate ' | cut -d' ' -f2)" = 0
      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --tail 150
